<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Daily Briefing Repository of Cybersecurity Threat Intelligence Briefings.">
    <meta name="author" content="Noor Elahi Ali Shibly">
    <title>Threat Briefing Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>

        :root {
            --bg-primary: #090d16;
            --bg-secondary: #0f1624;
            --bg-card: #0f1624;
            --bg-card-hover: #131c2e;
            --border-color: #1e293b;
            --border-soft: rgba(148, 163, 184, 0.14);
            --border-strong: rgba(148, 163, 184, 0.28);
            --text-primary: #eaf0fa;
            --text-secondary: #98a7be;
            --text-muted: #7b8aa1;
            --accent-blue: #38bdf8;
            --accent-cyan: #22d3ee;
            --severity-critical: #ff4d5e;
            --severity-high: #ff9448;
            --severity-medium: #fbbf24;
            --severity-low: #34d399;
            --kev-color: #f472b6;
            --glow-critical: rgba(255, 77, 94, 0.35);
            --glow-high: rgba(255, 148, 72, 0.32);
            --glow-blue: rgba(56, 189, 248, 0.32);
            --glow-kev: rgba(244, 114, 182, 0.30);
            --ring: rgba(56, 189, 248, 0.55);
            --radius-sm: 10px;
            --radius-md: 15px;
            --radius-lg: 18px;
            --gap-md: 16px;
            --gap-lg: 28px;
            --ease-smooth: cubic-bezier(0.22, 0.68, 0.32, 1);
            --shadow-card: 0 22px 50px -32px rgba(0, 0, 0, 0.95), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-primary);
            background-image:
                radial-gradient(900px circle at 12% -8%, rgba(56, 189, 248, 0.10), transparent 60%),
                radial-gradient(800px circle at 88% 0%, rgba(255, 77, 94, 0.08), transparent 55%),
                radial-gradient(700px circle at 50% 110%, rgba(34, 211, 238, 0.06), transparent 60%);
            background-attachment: fixed;
            color: var(--text-primary);
            line-height: 1.68;
            padding: 32px 20px 48px;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .container { max-width: 1180px; margin: 0 auto; }

        ::selection { background: rgba(56, 189, 248, 0.30); color: #f8fbff; }

        a:focus-visible,
        button:focus-visible {
            outline: 2px solid var(--ring);
            outline-offset: 3px;
            border-radius: 6px;
        }

        header {
            position: relative;
            overflow: hidden;
            background: linear-gradient(160deg, rgba(19, 28, 46, 0.92), rgba(9, 13, 22, 0.94));
            border: 1px solid var(--border-soft);
            border-radius: 18px;
            padding: 26px 30px;
            margin-bottom: var(--gap-lg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 18px;
            box-shadow: 0 24px 60px -32px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        header::before {
            content: "";
            position: absolute;
            inset: 0 0 auto 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-blue), var(--severity-critical), transparent);
            opacity: 0.85;
        }

        .brand-lockup { display: flex; align-items: center; gap: 16px; }

        .brand-mark {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            border-radius: 13px;
            display: grid;
            place-items: center;
            font-size: 1.4rem;
            background: linear-gradient(150deg, rgba(56, 189, 248, 0.20), rgba(255, 77, 94, 0.16));
            border: 1px solid rgba(56, 189, 248, 0.35);
            box-shadow: 0 0 22px -6px var(--glow-blue);
        }

        .header-title h1 {
            font-size: 1.62rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.25;
            color: var(--text-primary);
        }

        .header-title h1 .accent { color: var(--accent-blue); }

        .header-sub {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 7px;
            font-size: 0.78rem;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            letter-spacing: 0.04em;
        }

        .section-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.74rem;
            font-family: var(--font-mono);
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin: 0 0 var(--gap-md) 2px;
        }

        .section-label::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--border-color), transparent);
        }

        footer {
            margin-top: 48px;
            padding: 22px 24px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-soft);
            background: linear-gradient(170deg, rgba(19, 28, 46, 0.72), rgba(9, 13, 22, 0.9));
            text-align: center;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
        }

        .footer-credit {
            font-size: 0.84rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .footer-credit a {
            color: var(--accent-blue);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.18s ease, text-shadow 0.18s ease;
        }

        .footer-credit a:hover {
            color: #7dd3fc;
            text-shadow: 0 0 14px var(--glow-blue);
            text-decoration: underline;
            text-underline-offset: 4px;
        }


        .archive-count-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            border-radius: 10px;
            border: 1px solid rgba(56, 189, 248, 0.28);
            background: rgba(56, 189, 248, 0.08);
            color: var(--accent-blue);
            font-family: var(--font-mono);
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.04em;
        }

        .archive-panel {
            position: relative;
            overflow: hidden;
            background: linear-gradient(155deg, rgba(19, 28, 46, 0.95), rgba(9, 13, 22, 0.97));
            border: 1px solid rgba(56, 189, 248, 0.22);
            border-radius: var(--radius-lg);
            padding: 22px 24px 24px;
            box-shadow: var(--shadow-card);
        }

        .archive-panel::before {
            content: "";
            position: absolute;
            top: -55%;
            left: -8%;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.14), transparent 65%);
            pointer-events: none;
        }

        .archive-list {
            position: relative;
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 14px;
        }

        .archive-list li a {
            position: relative;
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 16px 18px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-soft);
            background: linear-gradient(168deg, rgba(17, 25, 41, 0.92), rgba(11, 16, 26, 0.95));
            color: var(--text-primary);
            text-decoration: none;
            transition: transform 0.22s var(--ease-smooth), background 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
        }

        .archive-list li a::before {
            content: "";
            position: absolute;
            left: 0;
            top: 14px;
            bottom: 14px;
            width: 3px;
            border-radius: 0 3px 3px 0;
            background: linear-gradient(180deg, rgba(56, 189, 248, 0.7), rgba(56, 189, 248, 0));
            opacity: 0.65;
            transition: opacity 0.22s ease;
        }

        .archive-list li a:hover {
            transform: translateY(-2px);
            background: linear-gradient(168deg, rgba(21, 31, 49, 0.96), rgba(13, 19, 31, 0.98));
            border-color: rgba(56, 189, 248, 0.38);
            box-shadow: 0 22px 44px -26px var(--glow-blue), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .archive-list li a:hover::before { opacity: 1; }

        .arc-icon {
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            border-radius: 11px;
            font-size: 1.05rem;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.32);
            box-shadow: 0 0 18px -8px var(--glow-blue);
            transition: transform 0.22s var(--ease-smooth);
        }

        .archive-list li a:hover .arc-icon { transform: scale(1.06); }

        .arc-text {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }

        .arc-pretty-date {
            font-size: 1.08rem;
            font-weight: 700;
            letter-spacing: -0.015em;
            line-height: 1.3;
            color: var(--text-primary);
            transition: color 0.18s ease;
        }

        .archive-list li a:hover .arc-pretty-date { color: var(--accent-blue); }

        .arc-date {
            font-family: var(--font-mono);
            font-size: 0.74rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        .arc-arrow {
            margin-left: auto;
            display: grid;
            place-items: center;
            width: 30px;
            height: 30px;
            flex-shrink: 0;
            border-radius: 8px;
            border: 1px solid var(--border-soft);
            background: rgba(148, 163, 184, 0.05);
            color: var(--text-muted);
            font-size: 0.9rem;
            transition: color 0.22s ease, border-color 0.22s ease, background 0.22s ease, transform 0.22s var(--ease-smooth);
        }

        .archive-list li a:hover .arc-arrow {
            color: var(--accent-blue);
            border-color: rgba(56, 189, 248, 0.35);
            background: rgba(56, 189, 248, 0.12);
            transform: translateX(3px);
        }

        .arc-empty {
            grid-column: 1 / -1;
            padding: 40px 24px;
            text-align: center;
            border: 1px dashed var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-muted);
            font-size: 0.92rem;
            background: rgba(148, 163, 184, 0.03);
        }

        @media (max-width: 720px) {
            body { padding: 18px 13px 32px; }
            header { padding: 22px; margin-bottom: 22px; }
            .header-title h1 { font-size: 1.3rem; }
            .archive-panel { padding: 16px; }
            .archive-list { grid-template-columns: 1fr; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
            .archive-list li a:hover { transform: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="brand-lockup">
                <div class="brand-mark">🛡️</div>
                <div class="header-title">
                    <h1>Threat <span class="accent">Briefing Archive</span></h1>
                    <div class="header-sub">
                        <span>DAILY BRIEFING REPOSITORY</span>
                    </div>
                </div>
            </div>
            <div class="archive-count-pill">
                <span>4 BRIEFINGS</span>
            </div>
        </header>

        <div class="section-label">Briefing History</div>
        <div class="archive-panel">
            <ul class="archive-list">
                <li><a href="2026-11-18/index.html"><span class="arc-icon">📅</span><span class="arc-text"><span class="arc-pretty-date">18 Nov 2026</span><span class="arc-date">2026-11-18</span></span><span class="arc-arrow">→</span></a></li>
                <li><a href="2026-11-17/index.html"><span class="arc-icon">📅</span><span class="arc-text"><span class="arc-pretty-date">17 Nov 2026</span><span class="arc-date">2026-11-17</span></span><span class="arc-arrow">→</span></a></li>
                <li><a href="2026-11-16/index.html"><span class="arc-icon">📅</span><span class="arc-text"><span class="arc-pretty-date">16 Nov 2026</span><span class="arc-date">2026-11-16</span></span><span class="arc-arrow">→</span></a></li>
                <li><a href="2026-11-15/index.html"><span class="arc-icon">📅</span><span class="arc-text"><span class="arc-pretty-date">15 Nov 2026</span><span class="arc-date">2026-11-15</span></span><span class="arc-arrow">→</span></a></li>
            </ul>
        </div>

        <footer>
            <div class="footer-credit">
                Created by <a href="https://noorelahialishibly.com" target="_blank" rel="noopener noreferrer">Noor Elahi Ali Shibly</a>
            </div>
        </footer>
    </div>
</body>
</html>
