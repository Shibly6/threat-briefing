<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Daily repository and historical archive of cybersecurity threat intelligence briefings.">
    <meta name="author" content="Noor Elahi Ali Shibly">
    <title>Threat Briefing Archive &bull; Historical Repository</title>

    <!-- Typography: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
{{SHARED_CSS}}
    </style>
</head>
<body>
    <div class="container">
        <!-- Site Header -->
        <header class="site-header">
            <div class="brand-section">
                <div class="brand-icon-wrapper" aria-hidden="true">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        <path d="M12 8v4"/>
                        <path d="M12 16h.01"/>
                    </svg>
                </div>
                <div class="brand-title-group">
                    <h1>Threat <span class="accent-text">Briefing Archive</span></h1>
                    <div class="header-meta">
                        <span>DAILY REPOSITORY &bull; {{BRIEFING_COUNT}} EDITIONS RECORDED</span>
                    </div>
                </div>
            </div>

            <!-- Universal Global Search Bar (Searches all briefings) -->
            <div class="global-search-container">
                <div class="global-search-input-wrapper">
                    <span class="global-search-icon">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </span>
                    <input type="text" id="global-search-input" class="global-search-input" placeholder="Search all briefings (CVE, vendor, threat, keyword)... [/]" autocomplete="off" aria-label="Global threat search">
                    <button id="global-search-clear-btn" class="global-search-clear" style="display:none;" title="Clear search">&times;</button>
                </div>
                <div id="global-search-results" class="global-search-results" style="display: none;"></div>
            </div>

            <div class="header-actions">
                <button id="theme-toggle-btn" class="btn theme-toggle-btn" title="Toggle Theme" aria-label="Toggle Theme">
                    <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="icon-moon" style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Archive Hero Section -->
        <section class="archive-hero">
            <div class="archive-hero-title">
                <h2>Historical Intelligence Cycles</h2>
                <p>Browse past daily briefings, CVE triages, and automated threat summaries.</p>
            </div>
        </section>

        <!-- Monthly Archive Sections -->
        <main>
{{ARCHIVE_MONTH_SECTIONS}}
        </main>

        <!-- Site Footer -->
        <footer class="site-footer">
            <div class="footer-text">
                Daily Threat Intelligence Briefing &bull; Authored &amp; Maintained by <a href="https://noorelahialishibly.com" target="_blank" rel="noopener noreferrer">Noor Elahi Ali Shibly</a>
            </div>
        </footer>
    </div>

    <!-- Client-Side Search Index & Interactivity -->
    <script>
{{INTERACTIVE_JS}}
    </script>
</body>
</html>
