
name: Schedule Trigger Check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Scheduler heartbeat
        run: |
          echo "GitHub scheduler is working!"
          echo "UTC time:"
          date -u
